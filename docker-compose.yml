services:
  db:
    image: postgres:16
    container_name: labbooker-db
    environment:
      POSTGRES_DB: labbooker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: labbooker-app
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/labbooker
      JWT_SECRET_KEY: your-secret-key
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data: